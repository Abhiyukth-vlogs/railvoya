<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>RailVoya - HTML/CSS Train Search & PNR Widget</title>
  <link rel="stylesheet" href="styles.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
</head>
<body>
  <div class="rail-container">
    <!-- Brand Header -->
    <header class="rail-header">
      <div class="logo">
        <span class="logo-icon">🚆</span>
        <span class="logo-text">Rail<span class="accent">Voya</span></span>
      </div>
      <span class="badge">Vanilla HTML/CSS Widget</span>
    </header>

    <!-- Main Widget Card -->
    <div class="widget-card">
      <div class="tabs">
        <button class="tab-btn active" id="tabSearch" onclick="switchTab('search')">Book Trains</button>
        <button class="tab-btn" id="tabPnr" onclick="switchTab('pnr')">PNR Status</button>
      </div>

      <!-- Train Search Form -->
      <form id="searchForm" class="form-section active" onsubmit="handleSearch(event)">
        <div class="input-grid">
          <div class="form-group">
            <label for="origin">From Station</label>
            <input type="text" id="origin" value="NDLS" placeholder="e.g. NDLS (New Delhi)" required>
          </div>
          <div class="form-group">
            <label for="destination">To Station</label>
            <input type="text" id="destination" value="BPL" placeholder="e.g. BPL (Bhopal)" required>
          </div>
          <div class="form-group">
            <label for="journeyDate">Journey Date</label>
            <input type="date" id="journeyDate" required>
          </div>
          <div class="form-group">
            <label for="quota">Quota</label>
            <select id="quota">
              <option value="GN">General Quota (GN)</option>
              <option value="TQ">Tatkal Quota (TQ)</option>
              <option value="LD">Ladies Quota (LD)</option>
              <option value="SS">Senior Citizen (SS)</option>
            </select>
          </div>
        </div>

        <button type="submit" class="primary-btn">
          <span>Search Trains</span>
          <span class="arrow">➔</span>
        </button>
      </form>

      <!-- PNR Status Form -->
      <form id="pnrForm" class="form-section" onsubmit="handlePnr(event)">
        <div class="form-group">
          <label for="pnrNumber">10-Digit PNR Number</label>
          <input type="text" id="pnrNumber" placeholder="Enter 10-digit PNR (e.g. 2458910243)" maxlength="15" required>
        </div>
        <button type="submit" class="primary-btn">
          <span>Check Live PNR Status</span>
          <span class="arrow">➔</span>
        </button>
      </form>

      <!-- Live Results Box -->
      <div id="results" class="results-box">
        <p class="placeholder-text">Submit search to fetch real-time Indian Railways PRS data.</p>
      </div>
    </div>
  </div>

  <script>
    // Set default tomorrow date
    const tomorrow = new Date();
    tomorrow.setDate(tomorrow.getDate() + 1);
    document.getElementById('journeyDate').value = tomorrow.toISOString().split('T')[0];

    function switchTab(tab) {
      document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
      document.querySelectorAll('.form-section').forEach(sec => sec.classList.remove('active'));
      if (tab === 'search') {
        document.getElementById('tabSearch').classList.add('active');
        document.getElementById('searchForm').classList.add('active');
      } else {
        document.getElementById('tabPnr').classList.add('active');
        document.getElementById('pnrForm').classList.add('active');
      }
    }

    async function handleSearch(e) {
      e.preventDefault();
      const origin = document.getElementById('origin').value.trim();
      const destination = document.getElementById('destination').value.trim();
      const date = document.getElementById('journeyDate').value;
      const quota = document.getElementById('quota').value;
      const resBox = document.getElementById('results');

      resBox.innerHTML = '<p class="loading">Loading trains from RailVoya API...</p>';

      try {
        const resp = await fetch(`http://127.0.0.1:8000/api/v1/trains/search?origin=${encodeURIComponent(origin)}&destination=${encodeURIComponent(destination)}&journey_date=${encodeURIComponent(date)}&quota=${encodeURIComponent(quota)}`);
        const data = await resp.json();
        const trains = Array.isArray(data) ? data : (data.trains || []);
        if (trains.length > 0) {
          resBox.innerHTML = `
            <h3>Found ${trains.length} Trains (${origin} ➔ ${destination}):</h3>
            <div class="trains-list">
              ${trains.map(t => `
                <div class="train-item">
                  <div class="train-info">
                    <strong>${t.train_number} - ${t.train_name}</strong>
                    <span>Departs ${t.departure_time} | Arrives ${t.arrival_time} (${t.duration})</span>
                  </div>
                  <div class="train-fare">
                    <span class="price">From ₹${t.classes[0]?.fare || 450}</span>
                    <a href="https://www.irctc.co.in/nget/train-search" target="_blank" class="irctc-link">⚡ IRCTC</a>
                  </div>
                </div>
              `).join('')}
            </div>
          `;
        } else {
          resBox.innerHTML = '<p>No trains found for selected route.</p>';
        }
      } catch (err) {
        resBox.innerHTML = `<p class="error">Error connecting to railway server: ${err.message}</p>`;
      }
    }

    async function handlePnr(e) {
      e.preventDefault();
      const pnr = document.getElementById('pnrNumber').value.trim();
      const resBox = document.getElementById('results');
      resBox.innerHTML = '<p class="loading">Verifying PNR with CRIS PRS...</p>';

      try {
        const resp = await fetch(`http://127.0.0.1:8000/api/v1/pnr/${encodeURIComponent(pnr)}`);
        const data = await resp.json();
        resBox.innerHTML = `
          <div class="pnr-card">
            <h3>PNR #${data.pnr_number} - ${data.chart_status}</h3>
            <p><strong>${data.train_number}</strong> ${data.train_name} (${data.origin_code} ➔ ${data.destination_code})</p>
            <p>Date: ${data.journey_date} | Class: ${data.travel_class}</p>
            <div class="passengers">
              ${data.passengers.map(p => `
                <div class="pax-row">
                  <span>Passenger ${p.passenger_number}</span>
                  <span class="status-cnf">${p.current_status}</span>
                  <span>Coach: <b>${p.coach}</b>, Berth: <b>${p.berth_number}</b> (${p.berth_type})</span>
                </div>
              `).join('')}
            </div>
          </div>
        `;
      } catch (err) {
        resBox.innerHTML = `<p class="error">Failed to fetch PNR: ${err.message}</p>`;
      }
    }
  </script>
</body>
</html>
